# Showcase reconstruction of the frontend/detail deployment topology.
# Replace welp-lab2:showcase with your registry image before applying.
apiVersion: v1
kind: Namespace
metadata:
  name: lab2
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: lab2
spec:
  # Course endpoint; change if your cluster uses a different Service CIDR.
  clusterIP: 10.96.88.88
  selector:
    app: frontend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: detail
  namespace: lab2
spec:
  selector:
    app: detail
  ports:
    - name: grpc
      port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: lab2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: welp-lab2:showcase
          args: [frontend, -port, "8080", -detailaddr, "detail:8081"]
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "1"
            limits:
              cpu: "1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: detail
  namespace: lab2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: detail
  template:
    metadata:
      labels:
        app: detail
    spec:
      containers:
        - name: detail
          image: welp-lab2:showcase
          args: [detail, -port, "8081"]
          ports:
            - containerPort: 8081
          resources:
            requests:
              cpu: "1"
            limits:
              cpu: "1"
